<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RiskLogin</title>
  <meta name="description" content="Risk-based sign-in: asks for more only when a login looks risky.">
  <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RiskLogin">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply the saved theme before first paint so there is no flash.
    try { const t = localStorage.getItem("rl.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app" class="shell" aria-live="polite"></div>
  <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p style="padding:24px">RiskLogin needs JavaScript to run.</p></noscript>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
